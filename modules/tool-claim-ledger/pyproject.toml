[project]
name = "amplifier-module-tool-claim-ledger"
version = "0.1.0"
description = "Deterministic claim ledger for the claim-guard adversarial claim-verification gate: worst-wins aggregation, file:line evidence enforcement, the evidence ratchet, stable claim IDs, and the gate rule -- all computed, never inferred by an LLM."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.entry-points."amplifier.modules"]
tool-claim-ledger = "amplifier_module_tool_claim_ledger:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_claim_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
