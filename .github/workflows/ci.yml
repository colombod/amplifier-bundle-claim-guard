name: CI

# Enforce the bundle's own rigor on every push / PR: the tool-claim-ledger test
# suite (worst-wins aggregation, file:line evidence enforcement, the R-1 over-collapse
# tripwire, the R-6 prompt<->normalizer drift guard, the lens-error/limb-4 tests) plus
# the harvest-stability harness self-check, plus lint.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tool-claim-ledger tests + harness selftest + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Create venv and install the module (+ amplifier_core, test deps)
        working-directory: modules/tool-claim-ledger
        run: |
          uv venv
          # Install INTO the venv we just created (--python .venv) so later steps that call
          # .venv/bin/python find everything -- pytest, the module, and amplifier_core.
          # The module's source imports `from amplifier_core import ToolResult` but does not
          # declare it (the host provides it at runtime), so install it explicitly from the
          # canonical source. NOTE: amplifier-core's pyproject.toml is at the repo ROOT
          # (Maturin-built; the package lives under python/ but is built from root) -- so NO
          # #subdirectory fragment (using one makes uv report "not a Python project").
          uv pip install --python .venv -e . pytest pytest-asyncio \
            "amplifier-core @ git+https://github.com/microsoft/amplifier-core@main"
          # Fail loudly here (not three steps later) if the venv is not actually complete.
          .venv/bin/python -c "import pytest, amplifier_core, amplifier_module_tool_claim_ledger; print('venv OK')"

      # Ruff is PINNED (uvx ruff@<version>) so CI and local runs use the same linter --
      # an unpinned `uvx ruff` pulls the latest and can fail on newly-enabled rules that
      # local didn't see (this exact drift broke a run: I001 on test imports).
      - name: Lint (ruff format --check + ruff check)
        working-directory: modules/tool-claim-ledger
        run: |
          uvx ruff@0.16.3 format --check amplifier_module_tool_claim_ledger tests
          uvx ruff@0.16.3 check amplifier_module_tool_claim_ledger tests

      - name: Lint the harness script
        run: |
          uvx ruff@0.16.3 format --check scripts/harvest_stability.py
          uvx ruff@0.16.3 check scripts/harvest_stability.py

      # Run against the .venv the install step populated -- NOT `uv run`, which re-syncs
      # to the module's own project env (dependencies = []) and drops amplifier_core,
      # causing ModuleNotFoundError: No module named 'amplifier_core'.
      - name: tool-claim-ledger test suite
        working-directory: modules/tool-claim-ledger
        run: .venv/bin/python -m pytest tests/ -q

      - name: Harvest-stability harness self-check
        # --selftest exercises the metric logic with synthetic sets; the identity import
        # is guarded, but run it through the same populated venv for consistency.
        run: modules/tool-claim-ledger/.venv/bin/python scripts/harvest_stability.py --selftest
