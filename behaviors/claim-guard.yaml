bundle:
  name: claim-guard-behavior
  version: 0.1.0
  description: >
    The claim-guard capability: the adversarial static-bench agents, the claim-ledger tool
    (deterministic aggregation + gate), and the thin awareness context. Compose this behavior
    onto any bundle to add the implementation-layer claim-verification gate.

# The deterministic trust anchor: the claim ledger, worst-wins aggregation, evidence
# enforcement, and the gate rule. Shipped as the local module modules/tool-claim-ledger.
# The tool exposes a single `claim_ledger` tool dispatched by `operation` — see
# docs/tool-claim-ledger-contract.md for the authoritative interface contract.
#
# NOTE: `source` is a pinned git URL (repo@main#subdirectory=modules/tool-claim-ledger), NOT a
# relative path. A relative `../modules/...` resolves against the *declaring file's* directory,
# which breaks under registry / `amplifier run` composition (it re-bases onto another bundle's
# cache dir). The pinned git URL resolves identically under direct load, registry composition, and
# git install. The same URL is used in every agent that declares this tool.
tools:
  - module: tool-claim-ledger
    source: git+https://github.com/colombod/amplifier-bundle-claim-guard@main#subdirectory=modules/tool-claim-ledger
    config:
      run_dir: .claim-guard        # ledger + artifacts live under <repo>/.claim-guard/<run-id>/

  # Concierge reachability under --app. Registers this repo's skills/ dir so BOTH concierge
  # entry points (claim-guard-here, claim-guard-review) exist wherever this behavior is layered,
  # with NO root bundle required.
  #
  # The skills source is a PINNED GIT URL, deliberately NOT "@claim-guard-behavior:skills".
  # VERIFIED (tool-skills _resolve_skill_sources + app_cli main.py CommandProcessor.__init__):
  #   - git-URL sources resolve EAGERLY at mount -> present in tool.skills BEFORE the CLI snapshots
  #     SKILL_SHORTCUTS -> the /claim-guard-* slash commands register.
  #   - "@namespace:path" sources resolve DEFERRED at first provider:request -> they arrive AFTER
  #     that snapshot -> load_skill works but the slash command silently does NOT register
  #     (this is exactly the incident: skills present to load_skill but the command missing).
  # Same pattern the council bundle uses for /council.
  #
  # MERGE SAFETY (foundation deep_merge): tools merge by module id and list-valued config
  # CONCATENATES with dedup, and app bundles compose LAST -> this APPENDS to whatever skills the
  # host bundle and the CLI already configured; it never replaces them. Do NOT set `visibility:`
  # here -- the host (or the CLI's skills.yaml) owns that policy; overriding it would hijack the host.
  - module: tool-skills
    source: git+https://github.com/microsoft/amplifier-bundle-skills@main#subdirectory=modules/tool-skills
    config:
      skills:
        - "git+https://github.com/colombod/amplifier-bundle-claim-guard@main#subdirectory=skills"

# The static bench (MVP). Two harvesters + two mandatory-core lenses + three conditional lenses.
# Phase-2 dynamic agents (probe-designer, pen-tester, regression-graduator) are intentionally
# NOT included here.
#
# empirical-verifier is the council's EMPIRICAL member: every other lens reads the source, it
# EXECUTES (runs the shipped test / a minimal repro / the real call; a DTU only if one happens to be
# available). Conditional — rostered when the changeset has a runnable/testable artifact. It is a
# lighter first-hand check than the Phase-2 pen-tester, which builds full adverse states.
agents:
  include:
    - claim-guard:claim-harvester
    - claim-guard:purpose-inquisitor
    - claim-guard:correspondence-auditor
    - claim-guard:test-correspondence-auditor
    - claim-guard:chokepoint-mapper
    - claim-guard:boundary-adversary
    - claim-guard:empirical-verifier

# Register the /claim-guard mode wherever this behavior is layered. A registered mode is INERT until
# explicitly activated: hooks-mode sets session_state["active_mode"] = None at mount and the
# tool-policy cascade only runs when a mode is set. Layering this behavior therefore CANNOT block a
# host bundle's write_file -- the mode is available (via /claim-guard or /modes) but never auto-active.
#
# search_paths is EXPLICIT (@claim-guard-behavior:modes) rather than relying on hooks-mode's lazy
# base_path namespace scan: the namespace is THIS file's bundle.name, so it resolves identically
# whether the behavior is layered standalone via --app or composed by bundle.md / with-probing.yaml.
hooks:
  - module: hooks-mode
    source: git+https://github.com/microsoft/amplifier-bundle-modes@main#subdirectory=modules/hooks-mode
    config:
      search_paths:
        - "@claim-guard-behavior:modes"

# Thin awareness pointer only (~250 tokens). All heavy knowledge lives in agents and skills.
context:
  include:
    - claim-guard:context/claim-guard-awareness.md
